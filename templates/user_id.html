<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrustVault · User ID</title><link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">T</div><p class="eyebrow">SECURE WORKSPACE</p>
    <h1>Enter your User ID</h1>
    <p class="muted">Signed in as {{ user.display_name }} ({{ user.role }}). Enter your User ID to continue.</p>
    <p class="hint">This ID is self-reported and will be visible to the document owner with your account role and submission time.</p>
    <form id="user-id-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>User ID<input name="user_id" maxlength="100" autocomplete="off" required autofocus></label>
      <button class="button primary full" type="submit">Continue to workspace <span>→</span></button>
      <p class="error" id="user-id-error" role="alert"></p>
    </form>
    <form action="/logout" method="post" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="text-button" type="submit">Sign out</button>
    </form>
  </main>
  <script>
    const form = document.querySelector("#user-id-form");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/session/user-id", {
        method: "POST",
        headers: {"Content-Type": "application/json", "X-CSRF-Token": form.csrf_token.value},
        body: JSON.stringify({user_id: form.user_id.value})
      });
      if (response.ok) {
        location.href = "/";
        return;
      }
      const result = await response.json().catch(() => ({}));
      document.querySelector("#user-id-error").textContent = result.error || "Could not save your User ID.";
    });
  </script>
</body>
</html>
